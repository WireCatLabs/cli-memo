# pnpm blocks dependencies' install scripts by default; since pnpm 11 each one is allowed here by name.
allowBuilds:
  esbuild: true
  lefthook: true
# Our own packages are used the day they are published.
minimumReleaseAgeExclude:
  - "@wirecat/*"

overrides:
  micromark-extension-math>katex: 0.19.1
