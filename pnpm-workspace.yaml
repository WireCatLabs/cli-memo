# pnpm blocks dependencies' install scripts by default; since pnpm 11 each one is allowed here by name.
allowBuilds:
  esbuild: true
  lefthook: true
# Our own packages are used the day they are published.
minimumReleaseAgeExclude:
  - "@wirecat/*"

overrides:
  markdownlint-cli2>smol-toml: 1.9.0
  micromark-extension-math>katex: 0.18.2

  "vite@7.3.6": 7.3.7
  "vite@8.3.2": 8.3.3

  "zod@4.6.5": 4.6.7
