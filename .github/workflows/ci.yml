name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@3c1ec927befbf4c19844ece6430cce7a0bd3790a # v0.48.0
    with:
      pack: ${{ inputs.pack || false }}
      bun-run: pnpm build && pnpm smoke:bun
      cli: true
      bin: memo
      # Off until the unit suite passes on Windows: its first run there failed the mail sync tests. macOS passed.
      platforms: false
