name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@03341651a008f77abb8172f86d6df652321b4ce5 # v0.31.0
    with:
      pack: ${{ inputs.pack || false }}
      bun: false
      checks: pnpm lint:commands
