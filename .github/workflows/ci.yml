name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@92629972be70b5c66ee20f75fac586dda13c540e # v0.96.0
    with:
      pack: ${{ inputs.pack || false }}
      bun-run: pnpm build && pnpm smoke:bun
      cli: true
      bin: memo
      checks: |
        pnpm smoke:node
      # Off until the unit suite passes on Windows: its first run there failed the mail sync tests. macOS passed.
      platforms: false
