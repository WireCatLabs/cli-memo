name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
      platforms:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@bd634ed738d6ae34dcf63e9dc4374063222bea83 # feat/node-ci-cli-profile
    with:
      pack: ${{ inputs.pack || false }}
      cli: true
      bin: memo
      # Linux only on main; a release, the monthly run and a manual run add Windows and macOS.
      platforms: ${{ inputs.pack || inputs.platforms || github.event_name == 'workflow_dispatch' }}
