name: Full validation

on:
  workflow_call:
    inputs:
      pack:
        type: boolean
        default: false
    outputs:
      package-sha256:
        value: ${{ jobs.ci.outputs.package-sha256 }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ci:
    uses: WireCatLabs/cli-base/.github/workflows/node-ci.yml@f5c9d9a1ec6efd8630566fd53f1b8092d12dd310 # v0.44.5
    with:
      pack: ${{ inputs.pack || false }}
      bun-run: pnpm build && pnpm smoke:bun
      cli: true
      bin: memo
      # Off until the unit suite passes on Windows: its first run there failed the mail sync tests. macOS passed.
      platforms: false
